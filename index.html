<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Snake — BBMW0 Technologies</title>
  <meta name="description" content="Neon Snake by BBMW0 Technologies. Classic snake game with neon visuals, power-ups, and high score tracking.">
  <meta name="theme-color" content="#061221">
  <style>
    :root {
      --navy:   #061221;
      --navy2:  #0a1e35;
      --navy3:  #0d2845;
      --teal:   #00c4a0;
      --teal2:  #009e82;
      --white:  #f0f6ff;
      --mid:    #7a9bbf;
      --gold:   #c9a84c;
      --red:    #ef4444;
      --border: rgba(0,196,160,.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--navy); color: var(--white); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }

    header { text-align: center; }
    .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo svg { opacity: .85; }
    .game-title { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
    .game-title span { color: var(--teal); }

    .hud {
      display: flex; gap: 20px; align-items: center;
      background: var(--navy2); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 20px; font-size: 13px; font-weight: 600;
    }
    .hud-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .hud-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--mid); }
    .hud-val { font-size: 20px; font-weight: 900; color: var(--teal); line-height: 1; }
    .hud-val.gold { color: var(--gold); }
    .hud-divider { width: 1px; height: 32px; background: var(--border); }

    canvas {
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(0,196,160,.12), 0 16px 48px rgba(0,0,0,.5);
      image-rendering: pixelated;
      touch-action: none;
    }

    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: rgba(6,18,33,.88); backdrop-filter: blur(6px);
      border-radius: 10px; padding: 32px 24px; text-align: center;
    }
    .overlay h2 { font-size: 28px; font-weight: 900; }
    .overlay h2 span { color: var(--teal); }
    .overlay p { font-size: 14px; color: var(--mid); line-height: 1.7; max-width: 280px; }
    .overlay .final-score { font-size: 52px; font-weight: 900; color: var(--teal); line-height: 1; }
    .overlay .high-score-label { font-size: 12px; color: var(--gold); font-weight: 700; margin-top: -4px; }

    .btn {
      background: var(--teal); color: var(--navy); border: none; border-radius: 8px;
      padding: 12px 28px; font-size: 14px; font-weight: 800; cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn:hover { background: var(--teal2); transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .controls-hint {
      font-size: 11px; color: var(--mid); text-align: center; line-height: 1.8;
    }

    .canvas-wrap { position: relative; }

    .power-up-label {
      font-size: 11px; color: var(--teal); font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      min-height: 16px; text-align: center;
    }

    .bbmw0-footer {
      font-size: 11px; color: var(--mid);
      display: flex; align-items: center; gap: 6px;
    }
    .bbmw0-footer a { color: var(--mid); }
    .bbmw0-footer a:hover { color: var(--teal); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 112 90" xmlns="http://www.w3.org/2000/svg" width="28" height="22" fill="#c9a84c" aria-hidden="true">
      <polygon points="0,57 18,13 36,53 56,7 76,53 94,13 112,57"/>
      <rect x="0" y="51" width="112" height="9"/>
      <polygon points="0,42 18,86 36,46 56,92 76,46 94,86 112,42"/>
    </svg>
    <span style="font-size:12px;font-weight:700;color:#c9a84c;letter-spacing:1px">BBMW0</span>
  </div>
  <div class="game-title">Neon <span>Snake</span></div>
</header>

<div class="hud">
  <div class="hud-item">
    <span class="hud-label">Score</span>
    <span class="hud-val" id="score-display">0</span>
  </div>
  <div class="hud-divider"></div>
  <div class="hud-item">
    <span class="hud-label">Best</span>
    <span class="hud-val gold" id="best-display">0</span>
  </div>
  <div class="hud-divider"></div>
  <div class="hud-item">
    <span class="hud-label">Level</span>
    <span class="hud-val" id="level-display">1</span>
  </div>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <canvas id="game" width="400" height="400"></canvas>

  <div class="overlay" id="overlay-start">
    <h2>Neon <span>Snake</span></h2>
    <p>Eat the glowing food to grow.<br>Avoid the walls and your own tail.<br>Collect power-ups for bonuses.</p>
    <button class="btn" id="btn-start">Play</button>
    <div class="controls-hint">
      Arrow keys / WASD &nbsp;|&nbsp; Swipe on mobile
    </div>
  </div>

  <div class="overlay" id="overlay-dead" style="display:none">
    <h2>Game <span>Over</span></h2>
    <div class="final-score" id="final-score">0</div>
    <div class="high-score-label" id="hs-label"></div>
    <button class="btn" id="btn-restart">Play Again</button>
  </div>
</div>

<div class="power-up-label" id="pu-label">&nbsp;</div>

<div class="bbmw0-footer">
  <svg viewBox="0 0 112 90" xmlns="http://www.w3.org/2000/svg" width="14" height="11" fill="#c9a84c" aria-hidden="true">
    <polygon points="0,57 18,13 36,53 56,7 76,53 94,13 112,57"/>
    <rect x="0" y="51" width="112" height="9"/>
    <polygon points="0,42 18,86 36,46 56,92 76,46 94,86 112,42"/>
  </svg>
  <a href="https://bbmw0.com" target="_blank" rel="noopener">BBMW0 Technologies</a>
  &nbsp;&middot;&nbsp;
  <a href="https://github.com/bbmw96/neon-snake" target="_blank" rel="noopener">GitHub</a>
</div>

<script>
const canvas  = document.getElementById('game');
const ctx     = canvas.getContext('2d');
const CELL    = 20;
const COLS    = canvas.width  / CELL;  // 20
const ROWS    = canvas.height / CELL;  // 20

const NAVY    = '#061221';
const NAVY2   = '#0a1e35';
const NAVY3   = '#0d2845';
const TEAL    = '#00c4a0';
const TEAL2   = '#009e82';
const WHITE   = '#f0f6ff';
const GOLD    = '#c9a84c';
const RED     = '#ef4444';
const AMBER   = '#f59e0b';
const PURPLE  = '#a855f7';

const DIR = { UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0] };

let snake, dir, nextDir, food, powerUp, score, best, level, gameLoop, alive, puTimer, puType, puLabel;
let touchStartX, touchStartY;

function loadBest() { return parseInt(localStorage.getItem('neon-snake-best') || '0', 10); }
function saveBest(v) { localStorage.setItem('neon-snake-best', v); }

function initGame() {
  snake   = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir     = DIR.RIGHT;
  nextDir = DIR.RIGHT;
  score   = 0;
  level   = 1;
  alive   = true;
  powerUp = null;
  puTimer = 0;
  puType  = null;
  best    = loadBest();
  placeFood();
  updateHUD();
}

function placeFood() {
  let pos;
  do { pos = {x: randInt(0, COLS-1), y: randInt(0, ROWS-1)}; }
  while (onSnake(pos) || (powerUp && powerUp.x === pos.x && powerUp.y === pos.y));
  food = pos;
}

function placePowerUp() {
  if (powerUp) return;
  const types = ['speed','points','shrink'];
  puType = types[randInt(0, types.length-1)];
  let pos;
  do { pos = {x: randInt(0, COLS-1), y: randInt(0, ROWS-1)}; }
  while (onSnake(pos) || (food.x === pos.x && food.y === pos.y));
  powerUp = pos;
  puTimer = 200;
}

function onSnake(pos) {
  return snake.some(s => s.x === pos.x && s.y === pos.y);
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getSpeed() {
  const base = 150;
  const minSpeed = 60;
  return Math.max(minSpeed, base - (level - 1) * 10);
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) { die(); return; }

  snake.unshift(head);
  let grew = false;

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += level * 10;
    grew = true;
    level = Math.floor(score / 100) + 1;
    placeFood();
    if (score % 50 === 0) placePowerUp();
  }

  // Eat power-up
  if (powerUp && head.x === powerUp.x && head.y === powerUp.y) {
    activatePowerUp();
    powerUp = null;
    puTimer = 0;
  }

  if (!grew) snake.pop();

  // Power-up timer
  if (powerUp) {
    puTimer--;
    if (puTimer <= 0) { powerUp = null; puType = null; document.getElementById('pu-label').textContent = ' '; }
  }

  if (score > best) { best = score; saveBest(best); }
  updateHUD();
  draw();
  clearTimeout(gameLoop);
  gameLoop = setTimeout(tick, getSpeed());
}

function activatePowerUp() {
  const labels = { speed:'Speed Boost!', points:'+50 Bonus Points!', shrink:'Shrink!' };
  document.getElementById('pu-label').textContent = labels[puType] || '';
  setTimeout(() => { document.getElementById('pu-label').textContent = ' '; }, 2000);

  if (puType === 'points') {
    score += 50;
  } else if (puType === 'shrink') {
    const newLen = Math.max(3, Math.floor(snake.length * 0.6));
    snake = snake.slice(0, newLen);
  }
}

function die() {
  alive = false;
  clearTimeout(gameLoop);
  if (score > best) { best = score; saveBest(best); }
  document.getElementById('final-score').textContent = score;
  document.getElementById('hs-label').textContent = score >= best && score > 0 ? 'New best score!' : 'Best: ' + best;
  document.getElementById('overlay-dead').style.display = 'flex';
}

function updateHUD() {
  document.getElementById('score-display').textContent = score;
  document.getElementById('best-display').textContent  = best;
  document.getElementById('level-display').textContent = level;
}

// ---- DRAW ----
function draw() {
  // Background
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = 'rgba(255,255,255,.03)';
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      ctx.fillRect(x * CELL + CELL/2 - 1, y * CELL + CELL/2 - 1, 2, 2);
    }
  }

  // Food glow
  const foodCX = food.x * CELL + CELL/2;
  const foodCY = food.y * CELL + CELL/2;
  const foodGlow = ctx.createRadialGradient(foodCX, foodCY, 1, foodCX, foodCY, CELL);
  foodGlow.addColorStop(0, TEAL);
  foodGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = foodGlow;
  ctx.fillRect(food.x * CELL - 2, food.y * CELL - 2, CELL + 4, CELL + 4);

  // Food
  ctx.fillStyle = TEAL;
  roundRect(ctx, food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 3);

  // Power-up
  if (powerUp) {
    const puCX = powerUp.x * CELL + CELL/2;
    const puCY = powerUp.y * CELL + CELL/2;
    const col = puType === 'speed' ? AMBER : puType === 'points' ? GOLD : PURPLE;
    const puGlow = ctx.createRadialGradient(puCX, puCY, 1, puCX, puCY, CELL);
    puGlow.addColorStop(0, col);
    puGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = puGlow;
    ctx.fillRect(powerUp.x * CELL - 2, powerUp.y * CELL - 2, CELL + 4, CELL + 4);
    ctx.fillStyle = col;
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 150);
    const sz = 4 + pulse * 2;
    roundRect(ctx, powerUp.x * CELL + sz/2, powerUp.y * CELL + sz/2, CELL - sz, CELL - sz, 3);
  }

  // Snake
  snake.forEach(function(seg, i) {
    const t = 1 - i / snake.length;
    const alpha = 0.35 + t * 0.65;
    if (i === 0) {
      // Head — brighter with glow
      ctx.shadowColor = TEAL;
      ctx.shadowBlur = 12;
      ctx.fillStyle = TEAL;
      roundRect(ctx, seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.shadowBlur = 0;
      // Eyes
      drawEyes(seg);
    } else {
      ctx.fillStyle = `rgba(0,196,160,${alpha.toFixed(2)})`;
      roundRect(ctx, seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 3);
    }
  });
}

function drawEyes(head) {
  const eyeOffset = [
    dir === DIR.UP    ? [-3, 3]  : dir === DIR.DOWN  ? [-3, CELL-6] :
    dir === DIR.LEFT  ? [2,  -3] : [CELL-5, -3],
    dir === DIR.UP    ? [3,  3]  : dir === DIR.DOWN  ? [3, CELL-6] :
    dir === DIR.LEFT  ? [2,  3]  : [CELL-5, 3]
  ];
  ctx.fillStyle = NAVY;
  eyeOffset.forEach(function(off) {
    const ex = dir[0] === 0 ? head.x * CELL + CELL/2 + off[0] : head.x * CELL + off[0];
    const ey = dir[1] === 0 ? head.y * CELL + CELL/2 + off[1] : head.y * CELL + off[1];
    ctx.beginPath();
    ctx.arc(ex, ey, 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
  ctx.fill();
}

// ---- INPUT ----
document.addEventListener('keydown', function(e) {
  const map = {
    ArrowUp:'UP', w:'UP', W:'UP',
    ArrowDown:'DOWN', s:'DOWN', S:'DOWN',
    ArrowLeft:'LEFT', a:'LEFT', A:'LEFT',
    ArrowRight:'RIGHT', d:'RIGHT', D:'RIGHT'
  };
  const d = map[e.key];
  if (!d) return;
  e.preventDefault();
  const nd = DIR[d];
  // Prevent reversing
  if (nd[0] === -dir[0] && nd[1] === -dir[1]) return;
  nextDir = nd;
});

canvas.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchend', function(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) {
    nd = dx > 0 ? DIR.RIGHT : DIR.LEFT;
  } else {
    nd = dy > 0 ? DIR.DOWN : DIR.UP;
  }
  if (nd[0] === -dir[0] && nd[1] === -dir[1]) return;
  nextDir = nd;
}, { passive: true });

// ---- BUTTONS ----
document.getElementById('btn-start').addEventListener('click', function() {
  document.getElementById('overlay-start').style.display = 'none';
  initGame();
  draw();
  gameLoop = setTimeout(tick, getSpeed());
});

document.getElementById('btn-restart').addEventListener('click', function() {
  document.getElementById('overlay-dead').style.display = 'none';
  initGame();
  draw();
  gameLoop = setTimeout(tick, getSpeed());
});

// ---- RESPONSIVE CANVAS ----
function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 32, window.innerHeight - 220);
  const size = Math.floor(maxW / CELL) * CELL;
  const ratio = size / 400;
  canvas.style.width  = size + 'px';
  canvas.style.height = size + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Initial draw (title screen state)
ctx.fillStyle = NAVY;
ctx.fillRect(0, 0, canvas.width, canvas.height);
best = loadBest();
updateHUD();
</script>
</body>
</html>
